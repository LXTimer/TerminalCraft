[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminalcraft"
version = "0.1.0"
description = "A 2D side-view Minecraft-like sandbox game that runs in the terminal."
# windows-curses (the curses backend on Windows) publishes wheels up to
# CPython 3.14; on 3.15 `import curses` fails with a missing `_curses`
# module, so the upper bound fails fast at install time instead of at runtime.
requires-python = ">=3.11,<3.15"
dependencies = [
    "windows-curses; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["terminalcraft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
